<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test1chatroom - 登录</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <h2>Test1chatroom</h2>
            <p class="subtitle">加入局域网聊天室</p>
            
            {% if error %}
            <div class="error-message">{{ error }}</div>
            {% endif %}
            
            <form id="login-form" method="POST" action="/login">
                <div class="form-group">
                    <label for="username">用户名</label>
                    <input type="text" id="username" name="username" placeholder="请输入用户名" required>
                    <small id="username-hint" class="hint"></small>
                </div>
                
                <div class="form-group">
                    <label for="password">密码</label>
                    <div class="password-container">
                        <input type="password" id="password" name="password" placeholder="请输入密码" required>
                        <button type="button" class="toggle-password-btn" onclick="togglePasswordVisibility()" aria-label="显示/隐藏密码">
                            <span class="toggle-password-icon">👁️</span>
                        </button>
                    </div>
                    <small id="password-hint" class="hint"></small>
                </div>
                
                <button type="submit" id="login-btn">登录</button>
            </form>
            <p class="switch-form">没有账号？<a href="{{ url_for('register') }}">注册</a></p>
        </div>
    </div>
    
    <script>
        // 显示/隐藏密码功能
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('password');
            const toggleBtn = document.querySelector('.toggle-password-icon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleBtn.textContent = '🙈';
            } else {
                passwordInput.type = 'password';
                toggleBtn.textContent = '👁️';
            }
        }
    </script>
</body>
</html>
