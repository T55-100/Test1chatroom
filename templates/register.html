<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - Test1chatroom</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <h2>Test1chatroom</h2>
            <p class="subtitle">加入局域网聊天室</p>
            
            {% if error %}
            <div class="error-message">{{ error }}</div>
            {% endif %}
            
            <form id="register-form" method="POST" action="/register">
                <div class="form-group">
                    <label for="username">用户名</label>
                    <input type="text" id="username" name="username" placeholder="请输入用户名" required>
                    <small id="username-hint" class="hint"></small>
                </div>
                <div class="form-group">
                    <label for="password">密码</label>
                    <input type="password" id="password" name="password" placeholder="请输入密码（至少6个字符）" required>
                    <small id="password-hint" class="hint"></small>
                </div>
                <div class="form-group">
                    <label for="confirm_password">确认密码</label>
                    <input type="password" id="confirm_password" name="confirm_password" placeholder="请再次输入密码" required>
                    <small id="confirm-password-hint" class="hint"></small>
                </div>
                <button type="submit" id="register-btn">注册</button>
            </form>
            <p class="switch-form">已有账号？<a href="{{ url_for('login') }}">登录</a></p>
        </div>
    </div>
    
    <script>
        // 表单验证
        document.getElementById('register-form').addEventListener('submit', function(e) {
            let isValid = true;
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm_password').value;
            
            // 用户名验证
            if (username.length < 2 || username.length > 20) {
                document.getElementById('username-hint').textContent = '用户名长度必须在2-20个字符之间';
                document.getElementById('username-hint').classList.add('error');
                isValid = false;
            } else {
                document.getElementById('username-hint').textContent = '';
                document.getElementById('username-hint').classList.remove('error');
            }
            
            // 密码验证
            if (password.length < 6) {
                document.getElementById('password-hint').textContent = '密码长度不能少于6个字符';
                document.getElementById('password-hint').classList.add('error');
                isValid = false;
            } else {
                document.getElementById('password-hint').textContent = '';
                document.getElementById('password-hint').classList.remove('error');
            }
            
            // 确认密码验证
            if (password !== confirmPassword) {
                document.getElementById('confirm-password-hint').textContent = '两次输入的密码不一致';
                document.getElementById('confirm-password-hint').classList.add('error');
                isValid = false;
            } else {
                document.getElementById('confirm-password-hint').textContent = '';
                document.getElementById('confirm-password-hint').classList.remove('error');
            }
            
            if (!isValid) {
                e.preventDefault();
            }
        });
    </script>
</body>
</html>
